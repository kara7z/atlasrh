spring:
  application:
    name: atlasrh
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/atlasrh}
    username: ${DB_USERNAME:atlasrh}
    password: ${DB_PASSWORD:atlasrh_dev}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

springdoc:
  override-with-generic-response: false
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    tags-sorter: alpha
    operations-sorter: alpha
