services:
  app:
    build:
      context: .
      target: build
    working_dir: /workspace
    entrypoint: ["./mvnw", "-B", "-ntp", "spring-boot:run"]
    command: []
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /workspace/src
        - action: rebuild
          path: ./pom.xml
        - action: rebuild
          path: ./Dockerfile
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      DB_URL: jdbc:mariadb://mariadb:3306/atlasrh
      DB_USERNAME: ${DB_USERNAME:-atlasrh}
      DB_PASSWORD: ${DB_PASSWORD:-atlasrh_dev}
    depends_on:
      mariadb:
        condition: service_healthy
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: atlasrh
      MARIADB_USER: ${DB_USERNAME:-atlasrh}
      MARIADB_PASSWORD: ${DB_PASSWORD:-atlasrh_dev}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_dev_only}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mariadb_data:
